# /etc/nginx/sites-available/surafel.afroawi.com
#
# Reverse proxy for the dockerized portfolio (container published on
# 127.0.0.1:3016). Start with this HTTP-only block, obtain the certificate
# with certbot, and certbot will rewrite this file to add the TLS server
# block + the HTTP->HTTPS redirect automatically.

server {
    listen 80;
    listen [::]:80;

    server_name surafel.afroawi.com;

    # Allow Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3016;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 60s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}

